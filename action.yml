name: "mcpwn"
description: "Static security scan of the MCP server configurations in a repository."
author: "Sn0wAlice"
branding:
  icon: shield
  color: red

inputs:
  path:
    description: "Directory to scan. Defaults to the repository root."
    required: false
    default: "."
  policy:
    description: "Path to an mcpwn.toml policy file. Optional."
    required: false
  lock:
    description: "Path to the mcp.lock baseline. Optional; rug-pull detection is skipped without one."
    required: false
  fail-on:
    description: "Lowest severity that fails the job: critical, high, medium, low, info."
    required: false
    default: "high"
  sarif-file:
    description: "Where to write the SARIF report."
    required: false
    default: "mcpwn.sarif"
  upload-sarif:
    description: "Upload the SARIF to GitHub code scanning. Needs `security-events: write`."
    required: false
    default: "true"

outputs:
  sarif-file:
    description: "Path to the SARIF report that was written."
    value: ${{ steps.scan.outputs.sarif-file }}
  findings:
    description: "Number of findings reported."
    value: ${{ steps.scan.outputs.findings }}

runs:
  using: composite
  steps:
    - name: Install mcpwn
      shell: bash
      run: cargo install --locked --git https://github.com/mlab-sh/mcpwn mcpwn

    - name: Scan
      id: scan
      shell: bash
      run: |
        set -euo pipefail

        # Built once, then reused for both the SARIF and the log summary. A
        # named policy or lock that does not exist is an error in mcpwn, on
        # purpose, so an input pointing at a missing file is simply not passed.
        args=("${{ inputs.path }}" --fail-on "${{ inputs.fail-on }}")
        if [ -n "${{ inputs.policy }}" ]; then
          if [ -f "${{ inputs.policy }}" ]; then
            args+=(--policy "${{ inputs.policy }}")
          else
            echo "::notice::no policy at ${{ inputs.policy }}, continuing without one"
          fi
        fi
        if [ -n "${{ inputs.lock }}" ]; then
          if [ -f "${{ inputs.lock }}" ]; then
            args+=(--lock "${{ inputs.lock }}")
          else
            echo "::notice::no lockfile at ${{ inputs.lock }}, rug-pull detection is skipped"
          fi
        fi

        # The exit code is captured rather than swallowed, so the upload still
        # happens when the scan reports findings.
        set +e
        mcpwn scan "${args[@]}" --format sarif > "${{ inputs.sarif-file }}"
        code=$?
        set -e

        findings=0
        if jq -e . "${{ inputs.sarif-file }}" >/dev/null 2>&1; then
          findings=$(jq '.runs[0].results | length' "${{ inputs.sarif-file }}")
        else
          echo "::error::mcpwn did not produce valid SARIF; see the summary below"
        fi

        {
          echo "sarif-file=${{ inputs.sarif-file }}"
          echo "findings=$findings"
          echo "exit-code=$code"
        } >> "$GITHUB_OUTPUT"

        # Human-readable summary in the job log, whatever the outcome.
        mcpwn scan "${args[@]}" --no-color || true

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.scan.outputs.findings != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: mcpwn

    - name: Fail if the scan did
      shell: bash
      run: exit ${{ steps.scan.outputs.exit-code }}
