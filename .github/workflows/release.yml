name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --all --locked

  version:
    name: Resolve version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: v
        run: |
          VERSION=$(awk -F '"' '/^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Pinned to 22.04 on purpose: a glibc binary never runs against a
          # glibc older than the one it was linked with, and ubuntu-latest
          # (24.04, glibc 2.39) produces binaries that refuse to start on
          # Debian 12 and Ubuntu 22.04. 22.04 lowers the floor to glibc 2.35.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Both the archive name and its contents are derived from the target
      # triple, so adding a target never means editing this step again.
      - name: Package archive
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          NAME="mcpwn-${VERSION}-${TARGET}"
          STAGE="$(mktemp -d)/${NAME}"
          mkdir -p "$STAGE"

          cp "target/${TARGET}/release/mcpwn" "$STAGE/"
          cp README.md "$STAGE/"
          # Dual-licensed, so whichever texts exist travel with the binary.
          # `|| :` because a failing test under `set -e` would kill the step.
          for f in LICENSE LICENSE-MIT LICENSE-APACHE; do
            [ -f "$f" ] && cp "$f" "$STAGE/" || :
          done

          FILE="${NAME}.tar.gz"
          tar -czf "$FILE" -C "$(dirname "$STAGE")" "$NAME"

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"

      # A release asset nobody can run is worse than none: the macOS runners
      # cannot execute the aarch64 build, so it is only smoke-tested where the
      # architecture matches.
      - name: Smoke test the binary
        if: matrix.target == 'x86_64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          ./target/${{ matrix.target }}/release/mcpwn --version
          ./target/${{ matrix.target }}/release/mcpwn explain MCPWN-CAP-001 --no-color > /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.file }}

  release:
    name: Publish release and the Homebrew formula
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist

      - name: Compute sha256 hashes
        id: hashes
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          for target in x86_64-apple-darwin aarch64-apple-darwin \
                        x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            FILE="dist/mcpwn-${VERSION}-${target}.tar.gz"
            HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
            key=$(echo "$target" | tr '[:lower:]-' '[:upper:]_')
            echo "${key}=${HASH}" >> "$GITHUB_OUTPUT"
            echo "  ${target}: ${HASH}"
          done

      # Generated rather than hand-maintained: a formula whose checksums are
      # edited by hand is a formula that is wrong one release out of three.
      - name: Generate Formula/mcpwn.rb
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p Formula
          cat > Formula/mcpwn.rb <<EOF
          # Generated by .github/workflows/release.yml. Do not edit by hand.
          class Mcpwn < Formula
            desc "Security scanner for MCP servers. Flags dangerous tool definitions, hidden instructions, cross-server exfiltration chains, and servers that changed after you approved them"
            homepage "https://github.com/mlab-sh/mcpwn"
            version "${VERSION}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/mlab-sh/mcpwn/releases/download/v#{version}/mcpwn-#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${{ steps.hashes.outputs.AARCH64_APPLE_DARWIN }}"
              else
                url "https://github.com/mlab-sh/mcpwn/releases/download/v#{version}/mcpwn-#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${{ steps.hashes.outputs.X86_64_APPLE_DARWIN }}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/mlab-sh/mcpwn/releases/download/v#{version}/mcpwn-#{version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${{ steps.hashes.outputs.X86_64_UNKNOWN_LINUX_GNU }}"
              elsif Hardware::CPU.arm?
                url "https://github.com/mlab-sh/mcpwn/releases/download/v#{version}/mcpwn-#{version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${{ steps.hashes.outputs.AARCH64_UNKNOWN_LINUX_GNU }}"
              end
            end

            def install
              bin.install "mcpwn"
            end

            test do
              assert_match "mcpwn", shell_output("#{bin}/mcpwn --version")
              # Exercises the rule catalogue, so a formula that installs a
              # binary missing its data fails here rather than in the field.
              assert_match "MCPWN-CAP-001", shell_output("#{bin}/mcpwn explain MCPWN-CAP-001")
            end
          end
          EOF
          sed -i 's/^          //' Formula/mcpwn.rb
          cat Formula/mcpwn.rb

      - name: Commit the formula
        run: |
          git add Formula/mcpwn.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, skipping commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: bump the Homebrew formula to v${{ needs.version.outputs.version }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*.tar.gz
