[package]
name = "mcpwn"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "Static, offline security scanner for MCP (Model Context Protocol) servers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mlab-sh/mcpwn"
authors = ["Sn0wAlice"]
readme = "README.md"
keywords = ["mcp", "security", "scanner", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mcpwn"
path = "src/lib.rs"

[[bin]]
name = "mcpwn"
path = "src/main.rs"

[dependencies]
# Engine
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# CLI shell
anyhow = "1"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "gzip"] }
unicode-security = "0.1.2"
unicode-script = "0.5.8"
unicode-normalization = "0.1.25"
sha2 = "0.11.0"
toml = "1.1.4"

[profile.release]
lto = "thin"
strip = true
