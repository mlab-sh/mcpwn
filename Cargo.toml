[package]
name = "mcpwn"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Static, offline security scanner for MCP (Model Context Protocol) servers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sn0wAlice/mcpwn"
authors = ["Sn0wAlice"]
readme = "README.md"
keywords = ["mcp", "security", "scanner", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mcpwn"
path = "src/lib.rs"

[[bin]]
name = "mcpwn"
path = "src/main.rs"

[dependencies]
# Engine
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# CLI shell
anyhow = "1"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"

[profile.release]
lto = "thin"
strip = true
